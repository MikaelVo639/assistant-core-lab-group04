[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-core"
version = "0.3.0"
description = "CSC10014 Lab 03 - Group 04 refactoring exercise"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "python-dotenv>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "python-bootcamp"]
testpaths = ["tests", "python-bootcamp/tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Keep the unmodified teaching example for before/after comparison.
extend-exclude = ["lab03/monolith"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
