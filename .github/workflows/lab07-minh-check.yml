name: Lab 7 Minh temporary verification
on:
  push:
    branches: [feat/lab07-MikaelVo639]
    paths: [.github/workflows/lab07-minh-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lab 7 and browser test dependencies
        run: |
          python -m pip install -r lab07/starter/requirements.txt playwright==1.51.0
      - name: Practice tests
        working-directory: lab07/practice
        run: python -m pytest -q test_hello_streamlit.py
      - name: Starter tests
        working-directory: lab07/starter
        run: python -m pytest -q
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser verification on the individual branch
        working-directory: lab07/starter
        env:
          LLM_PROVIDER: stub
          RATE_LIMIT_PER_MIN: '5'
          PYTHONPATH: src
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
        run: |
          cat > .lab07_verify_api.py <<'PY'
          import asyncio
          from assistant_api.main import create_app
          from assistant_core.config import load_settings
          from assistant_core.errors import ProviderError
          from assistant_core.llm import StubLLM
          from assistant_core.service import build_service

          class VerificationStub(StubLLM):
              def complete(self, prompt):
                  if 'reset my password' in prompt.lower():
                      raise ProviderError('simulated provider failure')
                  return super().complete(prompt)

          settings = load_settings()
          service = build_service(settings)
          service.rag.llm = VerificationStub()
          app = create_app(settings, service)

          @app.middleware('http')
          async def delay_chat(request, call_next):
              if request.url.path == '/v1/chat':
                  await asyncio.sleep(1.25)
              return await call_next(request)
          PY
          mv .lab07_verify_api.py lab07_verify_api.py
          python - <<'PY'
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          import httpx
          from playwright.sync_api import expect, sync_playwright

          evidence = Path('browser-evidence')
          evidence.mkdir(exist_ok=True)
          api = subprocess.Popen([sys.executable, '-m', 'uvicorn', 'lab07_verify_api:app'])
          ui = subprocess.Popen([sys.executable, '-m', 'streamlit', 'run', 'ui/app.py', '--server.headless=true'])

          def wait_for_server(url):
              for _ in range(80):
                  try:
                      if httpx.get(url, timeout=1).status_code == 200:
                          return
                  except httpx.HTTPError:
                      pass
                  time.sleep(.25)
              raise RuntimeError(f'Server did not become ready: {url}')

          try:
              wait_for_server('http://localhost:8000/health')
              wait_for_server('http://localhost:8501/_stcore/health')
              with sync_playwright() as pw:
                  browser = pw.chromium.launch()
                  page = browser.new_page(viewport={'width': 1080, 'height': 840})
                  page.goto('http://localhost:8501')
                  box = page.get_by_placeholder(re.compile('Ask about fees'))
                  expect(box).to_be_visible(timeout=20000)
                  expect(page.get_by_text('This is an AI assistant.', exact=False)).to_be_visible()

                  def ask(question):
                      box.fill(question)
                      box.press('Enter')

                  ask('   ')
                  expect(page.get_by_test_id('stChatMessage')).to_have_count(1)
                  print('PASS empty input does not add a chat message', flush=True)
                  ask('x' * 2001)
                  expect(page.get_by_text('Your question is too long (max 2000 characters).', exact=True)).to_be_visible()
                  print('PASS overlong input message', flush=True)
                  page.get_by_role('button', name='Can I register my thesis with 118 credits?').click()
                  expect(page.get_by_text('Thinking…', exact=True)).to_be_visible()
                  expect(page.get_by_text('Sources: H26#5.3', exact=False)).to_be_visible()
                  expect(page.get_by_text('120 accumulated credits', exact=False)).to_be_visible()
                  page.screenshot(path=evidence / 'answer-with-sources.png')
                  print('PASS sidebar, waiting and grounded answer', flush=True)
                  page.get_by_role('button', name='👎 Not helpful').click()
                  expect(page.get_by_text('Thanks — we will look at this answer.', exact=True)).to_be_visible()
                  page.screenshot(path=evidence / 'negative-feedback.png')
                  expect(page.get_by_role('button', name='👎 Not helpful')).to_have_count(0)
                  expect(page.get_by_text('Thanks — we will look at this answer.', exact=True)).to_be_hidden(timeout=12000)
                  expect(page.get_by_text('Feedback recorded.', exact=True)).to_be_visible()
                  page.screenshot(path=evidence / 'feedback-after.png')
                  print('PASS confirmation remains after the toast closes', flush=True)
                  ask('I lost my student card')
                  expect(page.get_by_text('I.102', exact=False)).to_be_visible()
                  page.get_by_role('button', name='👍 Helpful').click()
                  expect(page.get_by_text('Thanks for your feedback!', exact=True)).to_be_visible()
                  print('PASS both feedback buttons and duplicate prevention', flush=True)
                  ask('What is the capital of France?')
                  expect(page.get_by_text('A staff member can help:', exact=False)).to_be_visible()
                  page.screenshot(path=evidence / 'escalation.png')
                  ask('How do I reset my password?')
                  expect(page.get_by_text('Shown directly from the source document', exact=False)).to_be_visible()
                  ask('Where is the library?')
                  expect(page.get_by_text('room B.201', exact=False)).to_be_visible()
                  ask('Can I register my thesis with 118 credits?')
                  expect(page.get_by_text('Too many questions in a short time. Please wait a minute.', exact=False)).to_be_visible()
                  print('PASS escalation, degraded answer and rate limit', flush=True)
                  page.set_viewport_size({'width': 390, 'height': 844})
                  expect(box).to_be_visible()
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth')
                  page.screenshot(path=evidence / 'phone-width.png')
                  print('PASS phone-width layout', flush=True)
                  api.terminate()
                  api.wait(timeout=15)
                  ask('Is the assistant available?')
                  expect(page.get_by_text('Cannot reach the assistant.', exact=False).first).to_be_visible()
                  page.screenshot(path=evidence / 'backend-down.png')
                  print('PASS backend unavailable', flush=True)
          finally:
              for process in (ui, api):
                  if process.poll() is None:
                      process.terminate()
                      process.wait(timeout=15)
          PY
      - name: Attach browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab07-minh-browser-evidence
          path: lab07/starter/browser-evidence/*.png
          if-no-files-found: ignore
