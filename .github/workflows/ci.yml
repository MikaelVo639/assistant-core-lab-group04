name: CI

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Lab 4 is an untouched exercise starter; enable its own checks when implemented.
      # Keep validating the maintained Lab 3 package and tests.
      - name: Run Ruff check (Lab 3)
        run: |
          ruff check src tests

      - name: Run Ruff format check (Lab 3)
        run: |
          ruff format --check src tests

      - name: Run tests (Lab 3)
        run: |
          pytest -v tests
