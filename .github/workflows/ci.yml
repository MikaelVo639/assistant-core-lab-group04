name: CI

on:
  push:
    branches: ["main", "refactor/**", "py/**"]
  pull_request:
    branches: ["main", "refactor/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Ruff check
        run: |
          ruff check .

      - name: Run Ruff format check
        run: |
          ruff format --check .

      - name: Run tests
        run: |
          pytest -v tests python-bootcamp/tests --member mikaelvo639

  bootcamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bootcamp checks
        run: pip install pytest==8.3.3 ruff==0.6.9
      - name: Check bootcamp source and instructor W3 tests
        run: |
          ruff check python-bootcamp
          ruff format --check python-bootcamp
          pytest -q python-bootcamp/tests --member mikaelvo639
