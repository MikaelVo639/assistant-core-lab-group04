name: CI

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Ruff check (Lab 3)
        run: |
          ruff check src tests

      - name: Run Ruff format check (Lab 3)
        run: |
          ruff format --check src tests

      - name: Run tests (Lab 3)
        run: |
          pytest -v tests

  lab04:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: lab04/starter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab04/starter/requirements.txt
      - name: Install Lab 4 dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Check Lab 4 code
        run: |
          ruff check src tests ../practice
          ruff format --check src tests ../practice
      - name: Test warm-up P1-P5
        run: python -m pytest -q ../practice
      - name: Test assistant API T1-T4
        run: python -m pytest -q tests
